<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Raid - Dark Fantasy</title>
    <!-- Google Fonts for Medieval Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #050508;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        /* Vignette Effect over the entire page */
        box-shadow: inset 0 0 150px rgba(0,0,0,1);
      }
      #game-wrapper {
        position: relative;
        padding: 10px;
        background: #1a1a24;
        border: 2px solid #3a1c1c;
        border-radius: 8px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 50, 50, 0.2);
      }
      #game-container {
        display: block;
      }
      /* Preload font to ensure Phaser can use it immediately */
      .preload-font {
        font-family: 'Pirata One', serif;
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="preload-font">A</div>
    <div id="game-wrapper">
      <div id="game-container"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
